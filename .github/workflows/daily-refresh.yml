name: Daily listing refresh

on:
  schedule:
    # 09:00 KST = 00:00 UTC (offset 7 min off the hour to dodge GitHub's
    # top-of-hour scheduling congestion, which caused ~6h delay at :00)
    - cron: "7 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    # ignore docs/** so the workflow's own data-refresh commit doesn't
    # re-trigger itself in a loop - only template/script/workflow edits
    # pushed by hand should auto-rebuild+redeploy.
    paths-ignore:
      - "docs/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build report
        run: python3 build_report.py

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "daily data refresh $(date -u +%Y-%m-%d)"
          # Retry on push races (concurrent runs / a manual push landing at
          # the same time) instead of failing outright - rebase onto
          # whatever's now on origin/main and try again, a few times.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected, retrying ($i/5)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 1))
          done
          echo "::error::push failed after 5 retries"
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
