name: Daily listing refresh

on:
  schedule:
    # 09:00 KST = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    # ignore docs/** so the workflow's own data-refresh commit doesn't
    # re-trigger itself in a loop - only template/script/workflow edits
    # pushed by hand should auto-rebuild+redeploy.
    paths-ignore:
      - "docs/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build report
        run: python3 build_report.py

      # NOTE: docs/sindorim.html (the 신도림 전세/월세 시세 page) is NOT built here.
      # Its serve.co.kr source blocks GitHub Actions' datacenter IP, so running
      # sindorim_report.py on the runner would only ever produce an asil-only
      # (incomplete, 태영 missing) page and overwrite the good one. Instead it is
      # regenerated interactively (from an IP serve accepts) and committed, and this
      # workflow just deploys whatever docs/sindorim.html is checked in.

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "daily data refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
