name: Deploy listing pages

on:
  schedule:
    # 09:00 KST = 00:00 UTC. Safety re-deploy of the committed docs/ in case a
    # local-cron workflow_dispatch was missed; the actual build is done by the
    # local cron (refresh_all.sh, 08:30 KST) which dispatches this right after.
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    # ignore docs/** - the local cron commits docs and triggers deploy via
    # workflow_dispatch, so a docs push must not self-trigger. A hand push of
    # template/script/workflow files still redeploys the committed docs/.
    paths-ignore:
      - "docs/**"

# Deploy-only: no build, no commit here, so contents:read is enough.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deploy-only. BOTH pages (docs/index.html + docs/sindorim.html) are built
      # 4-source (NEONET+텐컴즈+asil+부동산써브) by the always-on local machine's
      # cron (refresh_all.sh) and committed. serve.co.kr blocks GitHub Actions'
      # datacenter IP, so building on the runner would silently drop serve and
      # overwrite the good pages with a 3-source version. This workflow just
      # publishes whatever docs/ is checked in; the local cron triggers it via
      # workflow_dispatch after each build.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
